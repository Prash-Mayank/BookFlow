server.port=8080
server.servlet.context-path=/bookflow

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=jdbc:mysql://localhost:3306/bookflow_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Mitthu@220105
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- HikariCP Connection Pool ---------------------------------
spring.datasource.hikari.pool-name=BookFlowPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---- JPA / Hibernate -------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---- File Upload (book cover images) ----------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
bookflow.upload.dir=uploads/covers/

# ---- Session -------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ---- Gemini API ------------------------------------------------
bookflow.gemini.api-key=your_gemini_api_key_here
bookflow.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent
bookflow.gemini.cache-hours=24

# ---- Fine Settings (defaults, overrideable in DB config table) ---
bookflow.fine.default-daily-rate=5.00
bookflow.fine.processing-charge=20.00

# ---- Borrow Settings ---------------------------------------------
bookflow.borrow.limit=3
bookflow.borrow.duration-days=14

bookflow.security.max-login-attempts=5

# ---- Logging -----------------------------------------------------
logging.level.com.bookflow=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/bookflow.log